name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每天 00:30 UTC 重建一次，自动同步 GitHub 上新增/改动的仓库信息
    - cron: "30 0 * * *"

permissions:
  contents: read

concurrency:
  group: cf-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          # Cloudflare Pages 服务在根路径，不设 GITHUB_PAGES（即不加 basePath）
          NEXT_PUBLIC_SITE_URL: https://shzzz.pages.dev
          # 用 Actions 自带 token 鉴权 GitHub API（5000/h），避免匿名限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=shzzz --branch=main
